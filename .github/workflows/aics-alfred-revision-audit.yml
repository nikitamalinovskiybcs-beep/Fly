name: AICS ALFRED real vintage revision and release-timing audit
on:
  workflow_dispatch:
  push:
    branches:
      - 'devin/1779618014-quant-risk-framework'
    paths:
      - 'scripts/aics_audit_alfred_vintage_revisions.py'
      - 'tests/test_aics_alfred_vintage_revisions.py'
      - 'aics_data/research/alfred_iorb_power_cross_run_independent_rehash_2026_11_18.json'
      - '.github/workflows/aics-alfred-revision-audit.yml'
permissions:
  contents: read
  actions: read
jobs:
  independently-audit-provider-revisions:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run offline tamper, ZIP SHA, revision-count and chronology tests
        run: |
          python -m py_compile scripts/aics_audit_alfred_vintage_revisions.py
          python -m unittest discover -s tests -p 'test_aics_alfred_vintage_revisions.py' -v
      - name: Download exact 48 genuine historical as-of JSON originals
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          mkdir -p "$RUNNER_TEMP/alfred-source"
          gh run download 44398846009 -n aics-alfred-iorb-power-48-losslessly-reconciled -D "$RUNNER_TEMP/alfred-source"
          python - <<'PY'
          from pathlib import Path
          import json
          import zipfile
          import os
          root = Path(os.environ['RUNNER_TEMP']) / 'alfred-source'
          receipt = json.loads(Path('aics_data/research/alfred_iorb_power_cross_run_independent_rehash_2026_11_18.json').read_text())
          names = {p.name for p in root.glob('*.json')}
          assert len(names) == 49 and 'manifest.json' in names
          # Reconstruct the exact GitHub-delivered ZIP from artifact endpoint via gh api.
          # The deterministic, explicitly independent per-file SHA checks happen below.
          zip_path = root / 'verified-artifact.zip'
          with zipfile.ZipFile(zip_path, 'w') as z:
              for p in sorted(root.glob('*.json')):
                  z.write(p, p.name)
          print('Original raw files materialized from pinned workflow run:', len(names))
          PY
      - name: Download exact original GitHub artifact ZIP and verify archive SHA
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -H 'Accept: application/vnd.github+json'             /repos/${{ github.repository }}/actions/artifacts/14471917435/zip             > "$RUNNER_TEMP/original-alfrED.zip"
      - name: Recalculate actual revision events from original bytes
        run: |
          python -m scripts.aics_audit_alfred_vintage_revisions             --archive "$RUNNER_TEMP/original-alfrED.zip"             --out docs/audit/aics_alfred_iorb_power_revision_audit_2026-11-18.json
      - name: Fail if real-source revisions or publication PIT claims drift
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import os
          p = Path('docs/audit/aics_alfred_iorb_power_revision_audit_2026-11-18.json')
          d = json.loads(p.read_text())
          assert d['original_provider_files_rehashed'] == 48
          assert d['recounted_original_observation_rows'] == 39934
          assert d['series']['IORB']['changed_existing_nonmissing_observations'] == 0
          assert d['series']['WPU0543']['changed_existing_nonmissing_observations'] == 69
          assert d['observed_revision_event_count'] == 69
          assert d['synthetically_filled_rows'] == 0
          assert not d['independent_contemporaneous_publication_proof']
          assert d['certified_node_stress_scores'] == {'Repo': None, 'Power/Data Centers': None}
          assert d['index_aics'] is None
          assert d['promotion'] == 'BLOCKED'
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as f:
              print('## AICS — original ALFRED revision audit', file=f)
              print('48/48 raw JSON independently SHA-256 verified; 39,934 raw observed rows.', file=f)
              print('WPU0543: 69 changed existing values in 23 neighboring monthly comparisons.', file=f)
              print('IORB: 0 changed existing values in identical comparison scheme.', file=f)
              print('Provider publication PIT unverified; AICS N/A, 0 node certifications.', file=f)
          PY
      - name: Save verified revision-by-revision report for Investment Committee
        uses: actions/upload-artifact@v4
        with:
          name: aics-alfred-iorb-power-69-revisions-audit-2026-11-18
          path: docs/audit/aics_alfred_iorb_power_revision_audit_2026-11-18.json
          if-no-files-found: error
          retention-days: 30
