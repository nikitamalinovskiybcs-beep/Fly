name: AICS index invariant tests
on:
  push:
    branches:
      - 'aics/**'
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run AICS unit tests
        run: python -m unittest discover -s scripts -p 'test_aics_index.py' -v
