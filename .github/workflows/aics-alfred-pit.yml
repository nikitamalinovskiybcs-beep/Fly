name: AICS historical ALFRED PIT audit
# Research-only; 24 actual monthly as-of snapshots per series. No backfill.
on:
  push:
    branches:
      - 'devin/1779618014-quant-risk-framework'
    paths:
      - '.github/workflows/aics-alfred-pit.yml'
      - 'scripts/aics_collect_alfred_pit.py'
      - 'scripts/aics_validate_alfred_pit.py'
      - 'scripts/aics_pit_coverage_report.py'
  workflow_dispatch:
  schedule:
    - cron: '45 11 * * 1'
  pull_request:
    paths:
      - '.github/workflows/aics-alfred-pit.yml'
      - 'scripts/aics_collect_alfred_pit.py'
      - 'scripts/aics_validate_alfred_pit.py'
permissions:
  contents: read
concurrency:
  group: aics-alfred-pit
  cancel-in-progress: false
jobs:
  historical-pit:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile PIT scripts
        run: python -m py_compile scripts/aics_collect_alfred_pit.py scripts/aics_validate_alfred_pit.py scripts/aics_pit_coverage_report.py
      - name: Collect actual monthly historical vintages
        if: github.event_name != 'pull_request'
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python scripts/aics_collect_alfred_pit.py
      - name: Validate as-of chronology and source coverage
        if: github.event_name != 'pull_request' && always()
        run: python scripts/aics_validate_alfred_pit.py
      - name: Report actual historical vintage coverage and gaps
        if: github.event_name != 'pull_request' && always()
        run: python scripts/aics_pit_coverage_report.py
      - name: Preserve PIT audit and failed-source evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aics-alfred-historical-pit
          path: aics_data/pit/
          retention-days: 30
          if-no-files-found: warn
