name: AICS OBDC original Private Credit 3-quarter SEC source audit
on:
  workflow_dispatch:
  push:
    branches:
      - 'devin/1779618014-quant-risk-framework'
    paths:
      - 'scripts/aics_collect_obdc_original_nonaccrual.py'
      - 'tests/test_aics_collect_obdc_original_nonaccrual.py'
      - '.github/workflows/aics-obdc-primary-credit-source.yml'
permissions:
  contents: read
jobs:
  verify-actual-sec:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test original SEC evidence and anti-backdating restrictions
        run: |
          python -m py_compile scripts/aics_collect_obdc_original_nonaccrual.py
          python -m unittest discover -s tests -p 'test_aics_collect_obdc_original_nonaccrual.py' -v
      - name: Download six original OBDC SEC HTML documents with source identity
        env:
          AICS_SEC_USER_AGENT: ${{ secrets.AICS_SEC_USER_AGENT || secrets.EDGAR_IDENTITY || secrets.SEC_USER_AGENT }}
        run: |
          python -m scripts.aics_collect_obdc_original_nonaccrual --as-of 2026-11-19
      - name: Independently SHA256 rehash all six original files and embargoed values
        run: |
          python - <<'PY'
          from pathlib import Path
          from datetime import date,timedelta
          import hashlib,json,os
          base=Path('aics_data/research/obdc_sec_originals')
          report=json.loads((base/'manifest.json').read_text(encoding='utf-8'))
          assert report['original_sec_html_files_sha256_verified']==6
          assert len(report['verified_source_periods'])==3
          assert report['visible_numeric_values']==6
          assert [x['nonaccrual_amortized_cost_percent'] for x in report['verified_source_periods']]==['2.0','2.8','2.9']
          assert [x['nonaccrual_fair_value_percent'] for x in report['verified_source_periods']]==['1.0','0.8','0.8']
          assert report['nonaccrual_cost_q1_to_q3_change_percentage_points']=='0.9'
          assert report['nonaccrual_fair_q1_to_q3_change_percentage_points']=='-0.2'
          assert report['synthetic_financial_observations']==0
          assert report['private_credit_stress_score'] is None and report['index_aics'] is None
          assert report['promotion']=='BLOCKED'
          assert report['provider_retroactive_originals_not_live_historical_capture'] is True
          assert not report['independent_24m_oos']
          for row in report['verified_source_periods']:
              for key in ['source_exhibit_sha256','source_index_sha256']:
                  hash=row[key]
                  raw=(base/(hash+'.html')).read_bytes()
                  assert hashlib.sha256(raw).hexdigest()==hash
              assert date.fromisoformat(row['SEC_available_at'])==date.fromisoformat(row['SEC_filed_at'])+timedelta(days=14)
              assert row['node_score_eligible'] is False
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as s:
              print('### OBDC direct SEC original non-accrual filings',file=s)
              print('Three SEC 8-K filing indexes and three original EX-99.1 releases; six raw SHA-256 checks.',file=s)
              print('2026 Q1: 2.0% cost/1.0% fair; Q2: 2.8%/0.8%; Q3: 2.9%/0.8%.',file=s)
              print('Original 8-K filed May 6, Aug 5, Nov 4; SEC+14 as-of May 20, Aug 19, Nov 18.',file=s)
              print('No extrapolation, synthetic series, certified PIT/OOS or trading signal.',file=s)
          PY
      - name: Preserve original issuer filings and complete evidence receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aics-obdc-real-original-sec-3-quarters
          path: aics_data/research/obdc_sec_originals/
          if-no-files-found: warn
          retention-days: 30
