name: Auto-Improve Model

on:
  schedule:
    # Run every Monday at 06:00 UTC
    - cron: '0 6 * * 1'
  workflow_dispatch:
    inputs:
      force_run:
        description: 'Force run even if no new data'
        required: false
        default: 'false'

jobs:
  auto-improve:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: base-branch

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run auto-improvement cycle
        id: improve
        run: |
          python -c "
          import json
          from src.auto_improve import run_full_improvement_cycle

          report = run_full_improvement_cycle()

          print('=== AUTO-IMPROVE REPORT ===')
          print(f'Improved: {report[\"improved\"]}')
          print(f'Before: acc={report[\"before\"][\"accuracy\"]}%, wr={report[\"before\"][\"win_rate\"]}%')
          print(f'After:  acc={report[\"after\"][\"accuracy\"]}%, wr={report[\"after\"][\"win_rate\"]}%')

          for name, result in report['strategies'].items():
              if 'error' in result:
                  print(f'{name}: ERROR - {result[\"error\"]}')
              else:
                  print(f'{name}: OK')

          if report.get('rollback'):
              print(f'ROLLBACK: {report[\"rollback_reason\"]}')

          # Save report as artifact
          with open('improvement_report.json', 'w') as f:
              json.dump(report, f, indent=2, default=str)

          # Set output for conditional commit
          improved = 'true' if report['improved'] and not report.get('rollback') else 'false'
          with open('$GITHUB_OUTPUT' if '$GITHUB_OUTPUT' != '\$GITHUB_OUTPUT' else '/dev/null', 'a') as f:
              f.write(f'improved={improved}\n')
              f.write(f'accuracy_before={report[\"before\"][\"accuracy\"]}\n')
              f.write(f'accuracy_after={report[\"after\"][\"accuracy\"]}\n')
              f.write(f'win_rate={report[\"after\"][\"win_rate\"]}\n')
          " 2>&1
          echo "improved=$([[ -f improvement_report.json ]] && python -c "import json; r=json.load(open('improvement_report.json')); print('true' if r['improved'] and not r.get('rollback') else 'false')" || echo 'false')" >> $GITHUB_OUTPUT

      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: improvement-report
          path: improvement_report.json

      - name: Commit improved weights (if accuracy increased)
        if: steps.improve.outputs.improved == 'true'
        run: |
          # Check if scoring weights file was updated
          if [ -f ~/phoenix_data/agi_params.json ]; then
            mkdir -p phoenix_data
            cp ~/phoenix_data/agi_params.json phoenix_data/ 2>/dev/null || true
            git config user.name "Phoenix Auto-Improve Bot"
            git config user.email "bot@phoenix-terminal.ai"
            git add -A
            if git diff --cached --quiet; then
              echo "No weight changes to commit"
            else
              REPORT=$(python -c "import json; r=json.load(open('improvement_report.json')); print(f'acc {r[\"before\"][\"accuracy\"]}% -> {r[\"after\"][\"accuracy\"]}%, wr {r[\"after\"][\"win_rate\"]}%')")
              git commit -m "auto-improve: $REPORT"
              git push
            fi
          fi
