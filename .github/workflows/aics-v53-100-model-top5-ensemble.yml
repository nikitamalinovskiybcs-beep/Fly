name: AICS V53 - 100 model experts select five and fuse

on:
  workflow_dispatch:
  push:
    branches:
      - devin/1779618014-quant-risk-framework
    paths:
      - scripts/aics_v53_hundred_model_top5_ensemble.py
      - tests/test_aics_v53_hundred_model_top5_ensemble.py
      - scripts/aics_v51_credit_magnitude_early_warning.py
      - aics_data/research/private_credit_2024q2_2026q1_first_sec_cost_breadth_2026-11-22.json
      - aics_data/research/aics_v18_private_credit_24m_pit_proxy_overlay_2026-11-22.json
      - aics_data/research/sp500_24_month_closes_2026-11-21.json
      - .github/workflows/aics-v53-100-model-top5-ensemble.yml

jobs:
  conductor:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout existing market and credit research
        uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Unit verify 100 distinct model strategies and five-model fusion
        run: |
          python -m compileall -q scripts/aics_v53_hundred_model_top5_ensemble.py tests/test_aics_v53_hundred_model_top5_ensemble.py
          python -m unittest discover -s tests -p 'test_aics_v53_hundred_model_top5_ensemble.py' -v
      - name: Let conductor evaluate 100 specialized models against actual market outcomes
        run: |
          python -m scripts.aics_v53_hundred_model_top5_ensemble --out aics_data/research/aics_v53_hundred_model_top5_ensemble_2026-11-22.json
      - name: Fail closed on data mining, OOS or production promotion
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('aics_data/research/aics_v53_hundred_model_top5_ensemble_2026-11-22.json')
          r=json.loads(p.read_text())
          assert r['hundred_distinct_deterministic_model_expert_strategies_executed']==100
          assert len(r['five_selected_unique_architecture_experts'])==5
          assert len({x['family'] for x in r['five_selected_unique_architecture_experts']})==5
          assert r['research_source_and_prior_market_comparable_months']==18
          assert r['selection_uses_same_historical_outcomes_as_reported_performance'] is True
          assert r['selection_is_posthoc_100_candidate_multiple_testing'] is True
          assert r['primary_crisis_10pct_auc_all_UNDEFINED'] is True
          assert r['selection_validation_failed_independent_OOS'] is True
          assert r['new_model_superior_forecast_skill_proven'] is None
          assert r['approved_live_AICS_index'] is None
          assert r['approved_trades_created'] is False
          q={k:v for k,v in r.items() if k not in
             ('100_separately_evaluated_model_experts','monthly_five_champion_shadow')}
          Path('aics_v53_conductor_executive_scoreboard.json').write_text(
             json.dumps(q,ensure_ascii=False,indent=2)+'\n')
          for m in r['five_selected_unique_architecture_experts']:
              print('TOP5',m['rank'],m['agent_id'],m['family'],m['variant'],
                    m['hindsight_5pct_auc_1m'],m['hindsight_5pct_auc_3m'],
                    m['hindsight_5pct_auc_6m'])
          for m in r['actual_sp500_hindsight_metrics']:
              if m['minimum_future_month_close_drawdown_pct']==5:
                  print('HORIZON',m['horizon_months'],
                        'N',m['n'],'positives',m['observed_positive_month_labels'],
                        'AUC old, mean, median, severity, market = ',
                        [m['hindsight_AUC_by_variant'][k] for k in
                         ['official_still_unapproved_legacy_fixed_cohort',
                          'five_experts_unweighted_mean','five_experts_robust_median',
                          'V51_severity_fixed_cohort','market_past_3month_drop']])
          PY
      - name: Write model conductor scorecard
        run: |
          python - <<'PY'
          import json,os
          r=json.load(open('aics_v53_conductor_executive_scoreboard.json'))
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:
              print('## AICS V53: 100 actual different specialized risk strategies → best five → model fusion',file=f)
              print('**100/100** distinct model candidates from **10** feature families, **5** different family winners selected and two fusion methods compiled.',file=f)
              print('**Caution:** winners selected on already seen 5% outcomes, only 18 or 15 observations per horizon, no unseen OOS; multiple comparisons invalidate skill claims.',file=f)
              for item in r['five_selected_unique_architecture_experts']:
                  print('- '+item['agent_id']+' '+item['family']+' variant '+str(item['variant'])+'; retrospective AUC 1/3/6m = '+str([item['hindsight_5pct_auc_1m'],item['hindsight_5pct_auc_3m'],item['hindsight_5pct_auc_6m']]),file=f)
              for item in r['actual_sp500_hindsight_metrics']:
                  if item['minimum_future_month_close_drawdown_pct']==5:
                      print('**'+str(item['horizon_months'])+'m:** mean/median five AUC = '+str(item['hindsight_AUC_by_variant']['five_experts_unweighted_mean'])+'/'+str(item['hindsight_AUC_by_variant']['five_experts_robust_median'])+', legacy '+str(item['hindsight_AUC_by_variant']['official_still_unapproved_legacy_fixed_cohort']),file=f)
              print('No 10% positive crash events, no 11-node historical PIT AICS or trading.',file=f)
          PY
      - name: Preserve all 100 candidate models and their fusion
        uses: actions/upload-artifact@v4
        with:
          name: aics-v53-100-different-model-experts-top5-fusion
          path: |
            aics_data/research/aics_v53_hundred_model_top5_ensemble_2026-11-22.json
            aics_v53_conductor_executive_scoreboard.json
          if-no-files-found: error
