name: AICS ARCC verified SEC available-at panel
on:
  workflow_dispatch:
  push:
    branches:
      - 'devin/1779618014-quant-risk-framework'
    paths:
      - 'scripts/aics_arcc_verified_asof_panel.py'
      - 'tests/test_aics_arcc_verified_asof_panel.py'
      - '.github/workflows/aics-arcc-verified-asof-panel.yml'
permissions:
  contents: read
  actions: read
jobs:
  verified-sec-panel:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test February look-ahead exclusion and SEC 14 day embargo
        run: |
          python -m py_compile scripts/aics_arcc_verified_asof_panel.py
          python -m unittest discover -s tests -p 'test_aics_arcc_verified_asof_panel.py' -v
      - name: Fetch independently verified original SEC audit artifact
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          curl --fail --silent --show-error --location --retry 2 --max-time 90 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GH_REPO/actions/artifacts/14476205791/zip" \
            -o "$RUNNER_TEMP/arcc_verified.zip"
          python - <<'PY'
          import zipfile,os
          from pathlib import Path
          z=zipfile.ZipFile(Path(os.environ['RUNNER_TEMP'])/'arcc_verified.zip')
          candidates=[n for n in z.namelist() if n.endswith('aics_arcc_primary_sec_nonaccrual_verified_2026-11-18.json')]
          assert len(candidates)==1
          (Path(os.environ['RUNNER_TEMP'])/'verified_arcc.json').write_bytes(z.read(candidates[0]))
          PY
      - name: Derive no-backfill verified available-at observations
        run: |
          python -m scripts.aics_arcc_verified_asof_panel \
            --verified "$RUNNER_TEMP/verified_arcc.json" --as-of 2026-11-18
      - name: Assert no look-ahead and no fake model certification
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          d=json.loads(Path('docs/audit/aics_arcc_verified_asof_panel_2026-11-19.json').read_text())
          assert len(d['source_observations'])==4
          assert d['source_observations'][0]['available_at']=='2026-05-12'
          assert all(x['available_at'] <= d['research_cutoff'] for x in d['source_observations'])
          assert d['synthetic_financial_observations']==0
          assert d['SEC_embargo_calendar_days']==14
          assert d['february_2026_unverified_claim_used'] is False
          assert d['private_credit_node_score'] is None and d['index_aics'] is None
          assert d['promotion']=='BLOCKED'
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:
              print('ARCC 4 original SEC-derived period values; Dec 2025 first proven as-of 2026-05-12; no Feb backfill. 0 certified nodes.',file=f)
          PY
      - name: Upload verified source-to-availability panel
        uses: actions/upload-artifact@v4
        with:
          name: aics-arcc-verified-sec-asof-panel
          path: docs/audit/aics_arcc_verified_asof_panel_2026-11-19.json
          if-no-files-found: error
          retention-days: 30
