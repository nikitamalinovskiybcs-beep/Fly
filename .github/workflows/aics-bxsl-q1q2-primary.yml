name: AICS BXSL 2026 Q1 Q2 original SEC nonaccrual
on:
  workflow_dispatch:
  push:
    branches:
      - 'devin/1779618014-quant-risk-framework'
    paths:
      - 'scripts/aics_collect_bxsl_q1_q2_sec_nonaccrual.py'
      - 'tests/test_aics_collect_bxsl_q1_q2_sec_nonaccrual.py'
      - '.github/workflows/aics-bxsl-q1q2-primary.yml'
permissions:
  contents: read
jobs:
  original-sec-q1q2:
    runs-on: ubuntu-latest
    timeout-minutes: 13
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test exact SEC filing and no synthetic data
        run: |
          python -m py_compile scripts/aics_collect_bxsl_q1_q2_sec_nonaccrual.py
          python -m unittest discover -s tests -p 'test_aics_collect_bxsl_q1_q2_sec_nonaccrual.py' -v
      - name: Fetch six original SEC HTML documents for BXSL first two quarters of 2026
        env:
          AICS_SEC_USER_AGENT: ${{ secrets.AICS_SEC_USER_AGENT || secrets.EDGAR_IDENTITY || secrets.SEC_USER_AGENT }}
        run: |
          python -m scripts.aics_collect_bxsl_q1_q2_sec_nonaccrual --as-of 2026-11-19
      - name: Verify original source hashes, SEC plus fourteen, and denominators
        run: |
          python - <<'PY'
          import datetime as dt
          import hashlib, json, os
          from decimal import Decimal
          from pathlib import Path
          p = Path('aics_data/research/bxsl_q1_q2_2026_sec_originals')
          d = json.loads((p/'manifest.json').read_text())
          assert d['schema_version'] == 'aics-bxsl-q1-q2-original-sec-nonaccrual-v1'
          assert d['original_8k_quarters'] == 2
          assert d['raw_original_sec_html_documents'] == 6
          assert d['original_reported_nonaccrual_percentages'] == 4
          assert d['synthetic_financial_rows'] == 0
          assert d['historical_realtime_feed_independently_attested'] is False
          assert d['independent_24month_oos'] is False
          assert d['node_score'] is None and d['index_aics'] is None
          assert d['promotion'] == 'BLOCKED'
          assert [x['period_end'] for x in d['source_periods']] == ['2026-03-31','2026-06-30']
          assert [(x['nonaccrual_amortized_cost_pct'],x['nonaccrual_fair_value_pct']) for x in d['source_periods']] == [('4.7','3.1'),('3.6','1.8')]
          for x in d['source_periods']:
              assert dt.date.fromisoformat(x['candidate_available_at']) == dt.date.fromisoformat(x['source_filed_at'])+dt.timedelta(days=14)
              assert x['cost_denominator'] != x['fair_denominator']
              assert x['source_to_score_eligible'] is False
              assert x['visible_after_sec_14d'] is True
              for category,digest in x['raw_sha256'].items():
                  original=(p/(digest+'.html')).read_bytes()
                  assert hashlib.sha256(original).hexdigest()==digest
                  assert len(original)==x['raw_bytes'][category]
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as out:
              print('## BXSL Q1-Q2 original SEC: 6/6 HTML source SHA checks',file=out)
              print('Q1 cost 4.7% fair 3.1%; SEC available 2026-05-21.',file=out)
              print('Q2 cost 3.6% fair 1.8%; SEC available 2026-08-20.',file=out)
              print('Research-only: historical feed PIT/OOS blocked, AICS N/A.',file=out)
          PY
      - name: Preserve original SEC HTML and lossless SHA manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aics-bxsl-original-sec-2026-q1-q2
          path: aics_data/research/bxsl_q1_q2_2026_sec_originals/
          if-no-files-found: warn
          retention-days: 30
