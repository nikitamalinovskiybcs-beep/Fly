name: AICS ten genuine live data acquisition waves

on:
  workflow_dispatch:
  push:
    branches:
      - devin/1779618014-quant-risk-framework
    paths:
      - scripts/aics_ten_source_collection_rounds.py
      - tests/test_aics_ten_source_collection_rounds.py
      - scripts/aics_sec_quarter_cashflow_gate.py
      - tests/test_aics_sec_quarter_cashflow_gate.py
      - scripts/aics_ten_model_improvement_agents.py
      - scripts/aics_early_imbalance_cashflow_shadow.py
      - scripts/aics_spv_funding_transmission_bridge.py
      - scripts/aics_v28_credit_relationship_topology.py
      - scripts/aics_v29_refinancing_maturity_overlay.py
      - scripts/aics_v30_cashflow_financing_bridge.py
      - scripts/aics_v31_interest_repo_dual_clock.py
      - scripts/aics_v32_v34_autonomous_research_rotation.py
      - scripts/aics_v35_v39_five_version_batch.py
      - scripts/aics_v40_v49_ten_pit_forensics_agents.py
      - scripts/aics_pit_100_real_cutoff_agents.py
      - scripts/aics_pit100_rebuild_24_month_public_filing_panel.py
      - tests/test_aics_pit100_rebuild_24_month_public_filing_panel.py
      - aics_data/research/sp500_24_month_closes_2026-11-21.json
      - tests/test_aics_pit_100_real_cutoff_agents.py
      - tests/test_aics_v40_v49_ten_pit_forensics_agents.py
      - aics_data/research/aics_24m_multi_node_publication_overlay_2026-11-21.json
      - aics_data/research/aics_v18_private_credit_24m_pit_proxy_overlay_2026-11-22.json
      - aics_data/progress/status.json
      - tests/test_aics_v35_v39_five_version_batch.py
      - tests/test_aics_v32_v34_autonomous_research_rotation.py
      - tests/test_aics_v31_interest_repo_dual_clock.py
      - aics_data/research/coreweave_q3_ir_interest_burden_2026-11-18.json
      - aics_data/research/repo_24_month_observed_research_2026-11-18.json
      - tests/test_aics_v30_cashflow_financing_bridge.py
      - aics_data/research/neocloud_q2_funding_2026.json
      - aics_data/research/neocloud_cash_coverage_2026_h1.json
      - aics_data/source_registry/neocloud_cash_h1_sec.json
      - tests/test_aics_v29_refinancing_maturity_overlay.py
      - aics_data/research/aics_v29_contractual_refinancing_terms_primary_sec_2026-11-22.json
      - tests/test_aics_v28_credit_relationship_topology.py
      - tests/test_aics_spv_funding_transmission_bridge.py
      - tests/test_aics_early_imbalance_2026_q1.py
      - aics_data/research/hyperscalers_2026_q1_original_sec_cashflow_2026-11-22.json
      - scripts/aics_thirty_agent_cycle.py
      - tests/test_aics_thirty_agent_cycle.py
      - tests/test_aics_ten_model_improvement_agents.py
      - scripts/aics_historical_crisis_analog.py
      - tests/test_aics_historical_crisis_analog.py
      - aics_data/research/ai_equities_aug_oct_2026_retrospective_shadow_2026-11-21.json
      - .github/workflows/aics-ten-real-source-waves.yml
  schedule:
    - cron: '15 23 * * *'

permissions:
  contents: read

concurrency:
  group: aics-real-collection-ten-waves-${{ github.ref }}
  cancel-in-progress: false

jobs:
  actual-source-acquisition:
    name: Ten sequential live collection passes with XBRL numeric evidence
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Set UTC research as-of for unattended daily runs
        run: |
          echo "AICS_ASOF_UTC=$(date -u +%F)" >> "$GITHUB_ENV"
          echo "AICS_RUN_TIMESTAMP_UTC=$(date -u +%FT%TZ)" >> "$GITHUB_ENV"
      - name: Compile ten real data acquisition waves and safety tests
        run: python -m compileall -q scripts/aics_ten_source_collection_rounds.py tests/test_aics_ten_source_collection_rounds.py
      - name: Run isolated collector numeric and provenance tests
        run: python -m unittest discover -s tests -p 'test_aics_ten_source_collection_rounds.py' -v
      - name: Verify direct SEC quarter cashflow original matching tests
        run: |
          python -m compileall -q scripts/aics_sec_quarter_cashflow_gate.py tests/test_aics_sec_quarter_cashflow_gate.py
          python -m unittest discover -s tests -p 'test_aics_sec_quarter_cashflow_gate.py' -v
      - name: PIT-first original source chronology audits V40-V49
        run: |
          python -m compileall -q scripts/aics_v40_v49_ten_pit_forensics_agents.py tests/test_aics_v40_v49_ten_pit_forensics_agents.py
          python -m unittest discover -s tests -p 'test_aics_v40_v49_ten_pit_forensics_agents.py' -v
      - name: Verify 100 historical PIT roles and public-filing date-not-14 policy
        run: |
          python -m compileall -q scripts/aics_pit_100_real_cutoff_agents.py tests/test_aics_pit_100_real_cutoff_agents.py
          python -m unittest discover -s tests -p 'test_aics_pit_100_real_cutoff_agents.py' -v
      - name: Verify ten model improvement agent evidence and forecasting gates
        run: |
          python -m compileall -q scripts/aics_ten_model_improvement_agents.py tests/test_aics_ten_model_improvement_agents.py
          python -m unittest discover -s tests -p 'test_aics_ten_model_improvement_agents.py' -v
      - name: Validate original 2000 versus 2008 analog and false lead-time claims
        run: |
          python -m compileall -q scripts/aics_historical_crisis_analog.py tests/test_aics_historical_crisis_analog.py
          python -m unittest discover -s tests -p 'test_aics_historical_crisis_analog.py' -v
      - name: Validate first-filed 2026 Q1 SEC+14 cashflow and seven-quarter progression
        run: |
          python -m compileall -q scripts/aics_early_imbalance_cashflow_shadow.py tests/test_aics_early_imbalance_2026_q1.py
          python -m unittest discover -s tests -p 'test_aics_early_imbalance_2026_q1.py' -v
          python -m scripts.aics_early_imbalance_cashflow_shadow --as-of "$AICS_ASOF_UTC" --out aics_data/research/aics_precrisis_imbalance_4hyperscalers_2025_2026_research_2026-11-22.json
      - name: Verify SPV borrower recourse and no misleading 2008 credit exposure
        run: |
          python -m compileall -q scripts/aics_spv_funding_transmission_bridge.py tests/test_aics_spv_funding_transmission_bridge.py
          python -m unittest discover -s tests -p 'test_aics_spv_funding_transmission_bridge.py' -v
          python -m scripts.aics_spv_funding_transmission_bridge --as-of "$AICS_ASOF_UTC" --out aics_data/agent_runs/ten_real_collection_rounds/aics_v27_spv_funding_transmission_research_2026-11-22.json
      - name: Verify source-dated lenders borrowers guarantors without invented exposures
        run: |
          python -m compileall -q scripts/aics_v28_credit_relationship_topology.py tests/test_aics_v28_credit_relationship_topology.py
          python -m unittest discover -s tests -p 'test_aics_v28_credit_relationship_topology.py' -v
          python -m scripts.aics_v28_credit_relationship_topology --as-of "$AICS_ASOF_UTC" --out aics_data/agent_runs/ten_real_collection_rounds/aics_v28_credit_relationship_topology.json
      - name: Verify original SEC contractual maturity, SOFR margin and covenant as-of gates
        run: |
          python -m compileall -q scripts/aics_v29_refinancing_maturity_overlay.py tests/test_aics_v29_refinancing_maturity_overlay.py
          python -m unittest discover -s tests -p 'test_aics_v29_refinancing_maturity_overlay.py' -v
          python -m scripts.aics_v29_refinancing_maturity_overlay --as-of "$AICS_ASOF_UTC" --out aics_data/agent_runs/ten_real_collection_rounds/aics_v29_refinancing_maturity_research.json
      - name: Reconcile original 2026 Q2 debt versus equity financing with SEC+14
        run: |
          python -m compileall -q scripts/aics_v30_cashflow_financing_bridge.py tests/test_aics_v30_cashflow_financing_bridge.py
          python -m unittest discover -s tests -p 'test_aics_v30_cashflow_financing_bridge.py' -v
          python -m scripts.aics_v30_cashflow_financing_bridge --as-of "$AICS_ASOF_UTC" --out aics_data/agent_runs/ten_real_collection_rounds/aics_v30_cashflow_financing_bridge.json
      - name: Verify IR versus SEC interest embargo and repo versus loan spread research
        run: |
          python -m compileall -q scripts/aics_v31_interest_repo_dual_clock.py tests/test_aics_v31_interest_repo_dual_clock.py
          python -m unittest discover -s tests -p 'test_aics_v31_interest_repo_dual_clock.py' -v
          python -m scripts.aics_v31_interest_repo_dual_clock --as-of "$AICS_ASOF_UTC" --out aics_data/agent_runs/ten_real_collection_rounds/aics_v31_interest_repo_dual_clock_research.json
      - name: Verify autonomous V32 V33 V34 source-backed credit research gates
        run: |
          python -m compileall -q scripts/aics_v32_v34_autonomous_research_rotation.py tests/test_aics_v32_v34_autonomous_research_rotation.py
          python -m unittest discover -s tests -p 'test_aics_v32_v34_autonomous_research_rotation.py' -v
      - name: Validate five real-data research gates V35 through V39 in one batch
        run: |
          python -m compileall -q scripts/aics_v35_v39_five_version_batch.py tests/test_aics_v35_v39_five_version_batch.py
          python -m unittest discover -s tests -p 'test_aics_v35_v39_five_version_batch.py' -v
      - name: Verify integrated 30-agent cycle research and fail-closed gates
        run: |
          python -m compileall -q scripts/aics_thirty_agent_cycle.py tests/test_aics_thirty_agent_cycle.py
          python -m unittest discover -s tests -p 'test_aics_thirty_agent_cycle.py' -v
      - name: Execute ten actual per-node source collection rounds
        env:
          AICS_SEC_USER_AGENT: ${{ secrets.EDGAR_IDENTITY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
        run: python -m scripts.aics_ten_source_collection_rounds --out aics_data/agent_runs/ten_real_collection_rounds
      - name: Reconcile genuine direct-quarter operating cashflow and cash CapEx without YTD mixing
        run: python -m scripts.aics_sec_quarter_cashflow_gate --input aics_data/agent_runs/ten_real_collection_rounds/actual_sec_xbrl_facts_unverified.json --out aics_data/agent_runs/ten_real_collection_rounds/sec_direct_quarter_cashflow_gate.json
      - name: Recompute original AICS mission - 2000 telecom vs 2008 shadow-bank crisis
        run: python -m scripts.aics_historical_crisis_analog --out aics_data/agent_runs/ten_real_collection_rounds/aics_2000_2008_2026_analog_research.json
      - name: Execute ten AICS model improvement agents on actual financial inputs
        run: python -m scripts.aics_ten_model_improvement_agents --sec-finance-audit aics_data/agent_runs/ten_real_collection_rounds/sec_direct_quarter_cashflow_gate.json --source-waves aics_data/agent_runs/ten_real_collection_rounds/ten_rounds_manifest.json --out aics_data/agent_runs/ten_real_collection_rounds/aics_model_improvement_agents.json
      - name: Close 30-role evidence-to-improvement loop without extra publisher requests
        run: |
          python -m scripts.aics_thirty_agent_cycle \
            --waves aics_data/agent_runs/ten_real_collection_rounds/ten_rounds_manifest.json \
            --finance aics_data/agent_runs/ten_real_collection_rounds/sec_direct_quarter_cashflow_gate.json \
            --out aics_data/agent_runs/ten_real_collection_rounds/aics_thirty_agent_research_cycle.json
      - name: Execute ten existing model agents as source-date PIT forensics V40-V49
        run: |
          python -m scripts.aics_v40_v49_ten_pit_forensics_agents --as-of "$AICS_ASOF_UTC" \
            --waves aics_data/agent_runs/ten_real_collection_rounds/ten_rounds_manifest.json \
            --finance aics_data/agent_runs/ten_real_collection_rounds/sec_direct_quarter_cashflow_gate.json \
            --out aics_data/agent_runs/ten_real_collection_rounds/aics_v40_v49_ten_pit_forensics_agents.json
      - name: Automatically rotate V32-V34 research priorities from the actual 30-agent run
        run: |
          python -m scripts.aics_v32_v34_autonomous_research_rotation --as-of "$AICS_ASOF_UTC" \
            --cycle aics_data/agent_runs/ten_real_collection_rounds/aics_thirty_agent_research_cycle.json \
            --out aics_data/agent_runs/ten_real_collection_rounds/aics_autonomous_v32_v34_research_rotation.json
      - name: Execute AICS V35-V39 source-driven research batch on 30-role live cycle
        run: |
          python -m scripts.aics_v35_v39_five_version_batch --as-of "$AICS_ASOF_UTC" \
            --out aics_data/agent_runs/ten_real_collection_rounds/aics_v35_v39_five_version_result.json
      - name: Execute 100 audited PIT roles across 100 actual historical source cutoffs
        run: |
          python -m scripts.aics_pit_100_real_cutoff_agents --as-of "$AICS_ASOF_UTC" \
            --cycle aics_data/agent_runs/ten_real_collection_rounds/aics_thirty_agent_research_cycle.json \
            --out aics_data/agent_runs/ten_real_collection_rounds/aics_100_pit_audit_runs_public_release_policy.json
      - name: Rebuild 24 genuine research months from source events with PIT100 checks
        run: |
          python -m compileall -q scripts/aics_pit100_rebuild_24_month_public_filing_panel.py tests/test_aics_pit100_rebuild_24_month_public_filing_panel.py
          python -m unittest discover -s tests -p 'test_aics_pit100_rebuild_24_month_public_filing_panel.py' -v
          python -m scripts.aics_pit100_rebuild_24_month_public_filing_panel \
            --as-of "$AICS_ASOF_UTC" \
            --pit100 aics_data/agent_runs/ten_real_collection_rounds/aics_100_pit_audit_runs_public_release_policy.json \
            --out aics_data/agent_runs/ten_real_collection_rounds/aics_24m_publication_date_rebuilt_research_panel.json \
            --report aics_data/agent_runs/ten_real_collection_rounds/aics_24m_publication_date_rebuild_quality_report.md
      - name: Verify 10 rounds, original bytes, actual XBRL values and absent fabricated AICS
        run: |
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          path = Path('aics_data/agent_runs/ten_real_collection_rounds')
          report = json.loads((path/'ten_rounds_manifest.json').read_text())
          values = json.loads((path/'actual_sec_xbrl_facts_unverified.json').read_text())
          analog = json.loads((path/'aics_2000_2008_2026_analog_research.json').read_text())
          assert analog['feature_axis_count']==8
          assert analog['quantitative_similarity_percent_2000'] is None
          assert analog['quantitative_similarity_percent_2008'] is None
          assert analog['comparison_eras']['telecom2000']['timing_audit']['early_warning_of_crisis_onset_status']=='OLD_CROSSING_AFTER_OBSERVED_CRISIS_ONSET'
          assert analog['comparison_eras']['subprime2008']['timing_audit']['early_warning_of_crisis_onset_status']=='OLD_CROSSING_AFTER_OBSERVED_CRISIS_ONSET'
          assert analog['2026_partial_known_weighted_points_not_full_index']=='268.39'
          finance = json.loads((path/'sec_direct_quarter_cashflow_gate.json').read_text())
          improvements = json.loads((path/'aics_model_improvement_agents.json').read_text())
          cycle = json.loads((path/'aics_thirty_agent_research_cycle.json').read_text())
          pit = json.loads((path/'aics_v40_v49_ten_pit_forensics_agents.json').read_text())
          assert pit['schema']=='aics-v40-v49-ten-specialist-pit-replay-agents-v1'
          assert pit['as_of']==cycle['cutoff_date']
          assert len(pit['ten_agent_research_results'])==10
          assert pit['source_premature_SEC_proxies']==27
          assert pit['private_credit_premature_quarters']==7
          assert pit['market_close_quarantined_node_months']==4
          assert pit['calendar_close_quarantined_node_months']==5
          assert pit['ten_agent_research_results'][4]['eligible_original_SEC_issuer_quarters']==28
          assert pit['ten_agent_research_results'][5]['independently_source_hashed_original_SEC_archives']==10
          assert pit['ten_agent_research_results'][5]['historically_PIT_attested_original_provider_receipts']==0
          assert pit['ten_agent_research_results'][6]['ALFRED_release_vintages_independently_attested']==0
          assert pit['approved_pit_certified_nodes']==0
          assert pit['newly_completed_certification_gates']==0
          assert pit['current_project_milestone_completion']==22
          assert pit['approved_11node_aics'] is None and pit['trades_created'] is False
          assert cycle['PIT_source_forensics']['ten_existing_improvement_agents_focused_on_PIT']==10
          assert cycle['PIT_source_forensics']['retroactive_SEC_plus1_violations']==27
          assert cycle['PIT_source_forensics']['private_credit_premature_quarters']==7
          assert improvements['pit_specialist_forensics']['market_month_end_quarantined_node_months']==4
          assert [r['research_result']['pit_source_date_forensics_assignment']['name'].split('_')[0]
                  for r in improvements['agents']]==[f'V{i}' for i in range(40,50)]
          assert cycle['agent_groups']['total_distinct_roles_executed']==30
          rotation = json.loads((path/'aics_autonomous_v32_v34_research_rotation.json').read_text())
          five = json.loads((path/'aics_v35_v39_five_version_result.json').read_text())
          pit100 = json.loads((path/'aics_100_pit_audit_runs_public_release_policy.json').read_text())
          rebuilt = json.loads((path/'aics_24m_publication_date_rebuilt_research_panel.json').read_text())
          assert rebuilt['schema']=='aics-24month-public-filing-date-PIT100-rebuilt-candidate-panel-v1'
          assert rebuilt['as_of']==cycle['cutoff_date']
          assert rebuilt['active_policy']==pit100['active_historical_research_source_policy']
          assert rebuilt['source_events_recomputed_from_unchanged_original_ledgers']==64
          assert len(rebuilt['monthly_rebuilt_panels']['market'])==24
          assert len(rebuilt['monthly_rebuilt_panels']['calendar'])==24
          assert rebuilt['original_PIT100_roles_individually_verified_against_rebuild']==100
          assert len(rebuilt['audit_100_unique_original_source_cutoffs'])==100
          assert rebuilt['same_day_unverified_market_close_filing_is_eligible'] is False
          assert len(rebuilt['same_day_ambiguous_release_conflicts_quarantined'])==1
          assert rebuilt['same_day_ambiguous_release_conflicts_quarantined'][0]['node']=='Semiconductors Supply'
          assert rebuilt['independently_historical_PIT_first_delivery_certified'] is False
          assert rebuilt['full_11node_AICS'] is None and rebuilt['aics_sp500_spread'] is None
          assert rebuilt['model_weights_changed'] is False and rebuilt['trades_created'] is False
          assert rebuilt['frozen_original_weights_total']==1050
          markdown=(path/'aics_24m_publication_date_rebuild_quality_report.md').read_text()
          assert markdown.startswith('# AICS PIT100')
          assert '| 2026-10 |' in markdown
          assert 'S&P 500' in markdown and 'G.17 source conflict' in markdown
          assert pit100['schema']=='aics-100-real-dated-PIT-audit-role-replays-v1'
          assert pit100['as_of']==cycle['cutoff_date']
          assert pit100['actual_distinct_aics_roles']==100
          assert pit100['new_PIT_specialist_roles']==70
          assert pit100['original_base_aics_roles']==30
          assert pit100['PIT_runs_successfully_computed']==100
          assert pit100['unique_historical_replay_cutoffs']==100
          assert pit100['SEC_14day_delay_is_active'] is False
          assert pit100['same_day_market_close_protected_without_verified_acceptance_time'] is True
          assert pit100['legacy_14day_date_difference_is_not_violation_under_active_policy'] is True
          assert pit100['publisher_request_count_from_these_100_replays']==0
          assert len(set(r['historical_cutoff'] for r in pit100['100_audit_results']))==100
          assert len(set(r['AICS_role_id'] for r in pit100['100_audit_results']))==100
          assert sum(r['existing_core_role'] for r in pit100['100_audit_results'])==30
          assert sum(r['new_specialist_role'] for r in pit100['100_audit_results'])==70
          assert pit100['newly_certified_historical_PIT_nodes']==0
          assert pit100['certified_11_node_AICS'] is None
          assert pit100['AICS_SP500_spread'] is None
          assert pit100['trades_created'] is False
          assert five['schema']=='aics-v35-v39-source-validated-five-version-batch-v1'
          assert five['as_of']==cycle['cutoff_date']
          assert five['version_count']==5
          assert [r['name'].split('_')[0] for r in five['versions']]==['V35','V36','V37','V38','V39']
          assert five['versions'][0]['observed_complete_calendar_quarters']==7
          assert five['versions'][0]['first_four_issuer_negative_gap_quarter']=='2026-Q3'
          assert five['versions'][0]['first_eligible_source_date']=='2026-11-13'
          assert five['versions'][1]['total_observed_deterioration_usd_m']=='-33134'
          assert five['versions'][1]['largest_contributing_issuer']=='Amazon'
          assert five['versions'][1]['largest_contributor_share_of_net_deterioration_pct']=='78.52'
          assert five['versions'][2]['source_eligible_q2_issuers']==2
          assert five['versions'][3]['earliest_known_contract_maturity']=='2027-10-16'
          assert five['versions'][3]['matched_instrument_new_spread_change_bps'] is None
          assert five['versions'][4]['approved_full_AICS'] is None
          assert five['versions'][4]['2008_historical_first_crisis_warning_reproduced'] is False
          assert five['synthetic_rows_added']==0
          assert five['production_weights_changed'] is False
          assert five['trades_created'] is False
          assert rotation['agents_exec_group_count']==30
          assert rotation['utc_as_of']==cycle['cutoff_date']
          assert rotation['v32_matched_loan_pricing_audit']['same_facility_two_eligible_amendments_verified']==0
          assert rotation['v32_matched_loan_pricing_audit']['net_spread_repricing_basis_points'] is None
          assert rotation['v33_issuer_funding_and_liquidity_audit']['q2_actual_sources_completely_reconciled'] is True
          assert rotation['v34_evidence_governance']['fixed_weights_total']==1050
          assert rotation['v34_evidence_governance']['certified_11node_aics'] is None
          assert rotation['autonomous_cycle_scope']=='SCHEDULED_EVIDENCE_COLLECTION_RESEARCH_ANALYSIS_AND_PRIORITIZATION'
          assert rotation['self_modifying_production_model_enabled'] is False
          assert rotation['production_trading_enabled'] is False
          assert cycle['source_collection']['http_attempts']==report['total_http_attempts']
          assert cycle['source_collection']['current_numeric_snapshot_rows']==len(values)
          assert cycle['source_collection']['direct_quarter_research_candidates']==finance['direct_original_3month_pair_candidates']
          assert cycle['analysis']['historical_full_aics_months']==0
          assert cycle['model_improvement']['untouched_oos_months']==0
          assert cycle['model_improvement']['2026_q1_4issuer_cashflow_complete'] is True
          assert cycle['model_improvement']['same_date_named_spv_borrower_facility_balance_edges']==2
          assert cycle['model_improvement']['coreweave_same_date_reported_debt_usd_m']==3938
          assert cycle['model_improvement']['credit_exposure_edges_verified']==0
          assert cycle['model_improvement']['v28_source_dated_credit_legal_edges']==9
          assert cycle['model_improvement']['v29_contractual_maturity_records']==3
          assert cycle['model_improvement']['v30_real_q2_issuer_funding_mechanisms_reconciled']==2
