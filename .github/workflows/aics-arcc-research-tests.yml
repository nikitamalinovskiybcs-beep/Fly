name: AICS ARCC non-accrual research monitor tests
on:
  workflow_dispatch:
  push:
    branches:
      - 'devin/1779618014-quant-risk-framework'
    paths:
      - 'scripts/aics_arcc_nonaccrual_monitor.py'
      - 'tests/test_aics_arcc_nonaccrual_monitor.py'
      - 'aics_data/research/arcc_primary_disclosures_2026-11-18.csv'
      - '.github/workflows/aics-arcc-research-tests.yml'
permissions:
  contents: read
jobs:
  research-only:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test PIT safety (no live downloads)
        run: python -m unittest discover -s tests -p 'test_aics_arcc_nonaccrual_monitor.py' -v
      - name: Build non-certified ARCC research report
        run: |
          python scripts/aics_arcc_nonaccrual_monitor.py aics_data/research/arcc_primary_disclosures_2026-11-18.csv --as-of 2026-11-18 --output aics_data/research/arcc_nonaccrual_summary.json
          python -c "import json; x=json.load(open('aics_data/research/arcc_nonaccrual_summary.json')); assert x['index_aics'] is None and x['private_credit_node_score'] is None and x['observations_used']==8"
      - name: Upload research report (not source attestation)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aics-arcc-nonaccrual-research-only
          path: aics_data/research/arcc_nonaccrual_summary.json
          if-no-files-found: warn
          retention-days: 30
