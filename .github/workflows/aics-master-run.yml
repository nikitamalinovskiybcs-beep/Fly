name: AICS Master Pipeline & PIT Audit
on:
  workflow_dispatch:
    inputs:
      as_of_date:
        description: 'Frozen source PIT cutoff (currently only 2026-11-18)'
        required: false
        default: '2026-11-18'
  schedule:
    - cron: '0 6 * * 1-5'
  push:
    branches:
      - 'devin/1779618014-quant-risk-framework'
    paths:
      - '.github/workflows/aics-master-run.yml'
      - 'scripts/aics_master_pipeline.py'
      - 'scripts/aics_pit_research_slice.py'
      - 'scripts/aics_fill_11_nodes_pit.py'
      - 'tests/test_aics_master_pipeline.py'
      - 'tests/test_aics_pit_integrity.py'
      - 'tests/test_aics_pit_integrity_v1_2_0.py'
      - 'aics_data/progress/status.json'
      - 'aics_data/source_registry/sec_spv_neoclouds_filings_2026-11-18.json'
      - 'aics_data/research/nyfed_repo_original_archive_independent_rehash_2026_11_18.json'
permissions:
  contents: read
concurrency:
  group: aics-master-safe-audit-${{ github.ref }}
  cancel-in-progress: false
jobs:
  aics-pit-verify-and-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run existing AICS index invariant unit tests
        run: python -m unittest discover -s tests -p 'test_aics_index.py' -v
      - name: Run AICS frozen evidence and existing 11-node PIT integrity tests
        run: python -m unittest discover -s tests -p 'test_aics_pit_integrity.py' -v
      - name: Run adapted user v1.2.0 SEC+14 ALFRED vintage and multiplier tests
        run: python -m unittest discover -s tests -p 'test_aics_pit_integrity_v1_2_0.py' -v
      - name: Test master runner never promotes unverified raw sources
        run: python -m unittest discover -s tests -p 'test_aics_master_pipeline.py' -v
      - name: Reconcile 11 node evidence at frozen historical cutoff
        env:
          AICS_AS_OF_DATE: ${{ inputs.as_of_date || '2026-11-18' }}
        run: python -m scripts.aics_master_pipeline --as-of "$AICS_AS_OF_DATE"
      - name: Prove output remains non-certified and cannot renormalize 1050
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          p = Path('docs/audit/aics_master_ci_report_2026-11-18.json')
          evidence = Path('docs/audit/aics_11_node_free_source_pit_2026-11-18.json')
          assert p.is_file() and evidence.is_file()
          report = json.loads(p.read_text(encoding='utf-8'))
          data = json.loads(evidence.read_text(encoding='utf-8'))
          assert report['as_of'] == data['as_of'] == '2026-11-18'
          assert report['collection_performed_by_master'] is False
          assert report['total_nodes'] == 11
          assert report['weights_fixed'] == 1050
          assert report['independently_certified_nodes'] == 0
          assert report['index_aics'] is None
          assert report['promotion'] == 'BLOCKED'
          assert data['reweight_after_ipo_permitted'] is False
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as output:
              print('## AICS master frozen-source PIT audit', file=output)
              print('11 nodes, fixed weights 1050, no backfilled historical observations.', file=output)
              print('SEC +14 days and ALFRED vintage isolation: unit tests executed.', file=output)
              print('This job audits existing source receipts; dedicated collectors are separate.', file=output)
              print('**Independent PIT 0/11, certified AICS N/A, no trading.**', file=output)
          PY
      - name: Upload honest frozen source PIT report for Investment Committee
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aics-master-frozen-pit-audit-${{ github.run_id }}
          path: docs/audit/aics_*_2026-11-18.json
          if-no-files-found: warn
          retention-days: 30
